<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" role="img" aria-label="Karawan Azizi - BS Computing student, software development, Java and Python" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="ka-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10070C"/>
      <stop offset="0.55" stop-color="#190B12"/>
      <stop offset="1" stop-color="#451126"/>
      <animate attributeName="x2" values="1;0.7;1" dur="12s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="ka-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#701A3D"/>
      <stop offset="0.5" stop-color="#C77B9B"/>
      <stop offset="1" stop-color="#E5B5C7"/>
    </linearGradient>
    <pattern id="ka-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#E5B5C7" stroke-opacity="0.07"/>
    </pattern>
    <radialGradient id="ka-glow" cx="0.8" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#C77B9B" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#C77B9B" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="320" fill="url(#ka-bg)"/>
  <rect width="1200" height="320" fill="url(#ka-grid)"/>
  <rect width="1200" height="320" fill="url(#ka-glow)"/>
  <g fill="none" stroke="#C77B9B" stroke-opacity="0.35">
    <circle cx="1000" cy="160" r="110"/>
    <circle cx="1000" cy="160" r="70" stroke-dasharray="4 8"/>
    <circle cx="1000" cy="50" r="5" fill="#E5B5C7">
      <animateTransform attributeName="transform" type="rotate" from="0 1000 160" to="360 1000 160" dur="14s" repeatCount="indefinite"/>
    </circle>
  </g>
  <path d="M60 270 C 300 210, 500 300, 760 240 S 1100 230, 1140 270" fill="none" stroke="url(#ka-line)" stroke-width="2" stroke-linecap="round" stroke-dasharray="1200" stroke-dashoffset="1200">
    <animate attributeName="stroke-dashoffset" from="1200" to="0" dur="4s" fill="freeze"/>
  </path>
  <text x="60" y="140" font-family="Georgia, 'Times New Roman', serif" font-size="64" fill="#F8F0F3" letter-spacing="1">Karawan Azizi</text>
  <text x="62" y="186" font-family="'Segoe UI', Arial, sans-serif" font-size="22" fill="#E5B5C7" letter-spacing="3">BS COMPUTING STUDENT  •  JAVA  •  PYTHON  •  PROBLEM SOLVING</text>
  <rect x="62" y="206" width="260" height="3" rx="1.5" fill="url(#ka-line)">
    <animate attributeName="width" values="120;320;120" dur="6s" repeatCount="indefinite"/>
  </rect>
</svg>

